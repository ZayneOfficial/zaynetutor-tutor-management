<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage tutoring students, grades, payments, invoices, and monthly reports with ZayneTutor.">
  <meta name="theme-color" content="#053199">
  <title>ZayneTutor | Tutor Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="brand-mark">🎓</div>
      <h1>Zayne<span>Tutor</span></h1>
      <p id="authDescription">Sign in to manage your tutoring business.</p>
      <div class="auth-error" id="authError" role="alert" hidden></div>
      <form id="authForm">
        <div id="authNameField" hidden>
          <label for="authName">Tutor name</label>
          <input id="authName" name="name" autocomplete="name" maxlength="120">
        </div>
        <label for="authEmail">Email</label>
        <input id="authEmail" name="email" type="email" autocomplete="email" maxlength="254" required>
        <label for="authPassword">Password</label>
        <input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="72" required>
        <button class="btn btn-primary" id="authSubmit" type="submit">Sign In</button>
      </form>
      <button class="auth-toggle" id="authToggle" type="button">Create a tutor account</button>
    </div>
  </section>

  <div class="app-shell" id="appShell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">🎓</div>
        <div>
          <strong>Zayne<span>Tutor</span></strong>
          <small>Learn · Improve · Succeed</small>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-link active" data-page="dashboard"><span>⌂</span> Dashboard</button>
        <button class="nav-link" data-page="students"><span>♟</span> Students</button>
        <button class="nav-link" data-page="grades"><span>▣</span> Grades</button>
        <button class="nav-link" data-page="payments"><span>▤</span> Payments</button>
        <button class="nav-link" data-page="invoices"><span>▧</span> Invoices</button>
        <button class="nav-link" data-page="reports"><span>▥</span> Reports</button>
        <button class="nav-link" data-page="settings"><span>⚙</span> Settings</button>
      </nav>

      <div class="sidebar-quote">“Small steps<br>lead to big results.”</div>
      <div class="sidebar-footer">Tutor Management System<br><span>Secure account storage</span></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div class="search-wrap">
          <span>⌕</span>
          <input id="globalSearch" type="search" placeholder="Search students...">
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="notificationBtn" title="Notifications">🔔<b id="notificationCount">0</b></button>
          <div class="profile">
            <div class="avatar">T</div>
            <div><strong id="tutorNameTop">Tutor</strong><small>Tutor</small></div>
          </div>
          <button class="btn btn-sm" id="signOut" type="button">Sign Out</button>
        </div>
      </header>

      <section class="content">
        <div id="page-dashboard" class="page active"></div>
        <div id="page-students" class="page"></div>
        <div id="page-grades" class="page"></div>
        <div id="page-payments" class="page"></div>
        <div id="page-invoices" class="page"></div>
        <div id="page-reports" class="page"></div>
        <div id="page-settings" class="page"></div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
